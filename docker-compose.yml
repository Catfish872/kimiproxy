# docker-compose.yml

services:
  kimiproxy:
    # 优先使用 GHCR 上的镜像，并默认使用 'latest' 标签
    image: ghcr.io/catfish872/kimiproxy:latest
    # build 指令作为备用，供需要在本地构建的用户使用
    # 当运行 `docker compose up --build` 时，它会覆盖 image 指令并进行本地构建
    build:
      context: .
    container_name: kimiproxy-service
    ports:
      - "11435:11435"
    restart: unless-stopped
