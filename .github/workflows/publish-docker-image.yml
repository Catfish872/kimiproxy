# .github/workflows/publish-docker-image.yml

name: Build and Push Docker Image to GHCR

# 触发条件: 当有代码推送到 main 分支时触发
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录到 GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. ★★★ 核心修复：创建一个小写的仓库名称变量 ★★★
      #    完全遵照您提供的可靠模式。
      - name: Convert repository name to lowercase
        id: repo_lowercase # 给这个步骤一个ID，方便后面引用它的输出
        # 使用最通用的 `tr` 命令来确保转换成功
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 4. 提取元数据（镜像名称和标签）
      #    现在使用上一步生成的小写变量，确保镜像名称完全合法
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 使用 `steps.repo_lowercase.outputs.name` 来引用上一步的结果
          images: ghcr.io/${{ steps.repo_lowercase.outputs.name }}

      # 5. 构建并推送到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
