# .github/workflows/publish-docker-image.yml

name: Build and Push Docker Image to GHCR

# 触发条件: 当有代码推送到 main 分支时触发
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录到 GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 创建一个小写的仓库名称变量
      - name: Convert repository name to lowercase
        id: repo_lowercase
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 4. 提取元数据（镜像名称和标签）
      #    这是经过验证的、可以同时生成 branch 和 latest 标签的正确写法
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_lowercase.outputs.name }}
          tags: |
            # 为当前事件生成标签 (例如 'main' 用于推送到 main 分支)
            type=ref,event=branch
            # 仅当事件是推送到 main 分支时，才添加 'latest' 标签
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 5. 构建并推送到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
